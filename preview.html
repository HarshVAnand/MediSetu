    function calculateDistance(lat1, lon1, lat2, lon2) {
      if (lat1 === undefined || lon1 === undefined || lat2 === undefined || lon2 === undefined) return 0;
      const R = 6371; // Earth radius in km
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLon = ((lon2 - lon1) * Math.PI) / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos((lat1 * Math.PI) / 180) *
          Math.cos((lat2 * Math.PI) / 180) *
          Math.sin(dLon / 2) *
          Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return parseFloat((R * c).toFixed(1));
    }

    function getHospitalsInRadius(userLat, userLng, radiusKm, filters = {}) {
      const { category = 'ALL', emergencyOnly = false, icuOnly = false, searchQuery = '' } = filters;
      return INITIAL_FACILITIES.map(fac => {
        const dist = calculateDistance(userLat, userLng, fac.lat, fac.lng);
        return { ...fac, distanceKm: dist };
      })
      .filter(fac => {
        if (radiusKm && fac.distanceKm > radiusKm) return false;
        if (category !== 'ALL' && fac.category !== category) return false;
        if (emergencyOnly && !fac.emergency24x7) return false;
        if (icuOnly && (!fac.icuBeds || fac.availableIcuBeds <= 0)) return false;
        if (searchQuery && searchQuery.trim() !== '') {
          const q = searchQuery.toLowerCase().trim();
          const matches = fac.name.toLowerCase().includes(q) ||
                          fac.address.toLowerCase().includes(q) ||
                          fac.facilityType.toLowerCase().includes(q) ||
                          fac.doctorsOnDuty.some(d => d.name.toLowerCase().includes(q) || d.role.toLowerCase().includes(q));
          if (!matches) return false;
        }
        return true;
      })
      .sort((a, b) => a.distanceKm - b.distanceKm);
    }

              </div>

                      <div style={{ fontSize: '0.85rem', color: 'var(--text-muted)', display: 'flex', gap: '0.75rem', flexWrap: 'wrap' }}>
                        <span>Age: {currentUser.age} Yrs ({currentUser.gender})</span>
                        <span>•</span>
                        <span>Blood: <strong style={{ color: '#dc2626' }}>{currentUser.bloodGroup}</strong></span>
                        <span>•</span>
                        <span>Card: <strong>{currentUser.abhaId}</strong></span>
                      </div>
                      <div style={{ fontSize: '0.8rem', color: 'var(--text-subtle)', marginTop: '0.35rem' }}>
                        📍 {currentUser.village} • Local Health Worker: <strong>{currentUser.assignedAsha}</strong>
                      </div>
                    </div>

                    <div style={{ display: 'flex', gap: '0.5rem' }}>
                      <button onClick={() => setQrModalOpen(true)} className="btn btn-secondary btn-sm">
                        📱 View Health QR Card
                      </button>
                    </div>
                  </div>
                </div>

                {/* Dashboard Tabs */}
                <div className="tabs-container">
                  <button onClick={() => setPatientTab('timeline')} className={`tab-btn ${patientTab === 'timeline' ? 'active' : ''}`}>
                    📋 Health History
                  </button>
                  <button onClick={() => setPatientTab('prescriptions')} className={`tab-btn ${patientTab === 'prescriptions' ? 'active' : ''}`}>
                    💊 Medicine Schedule
                  </button>
                  <button onClick={() => setPatientTab('assistant')} className={`tab-btn ${patientTab === 'assistant' ? 'active' : ''}`}>
                    ✨ Ask Health Questions
                  </button>
                  <button onClick={() => setPatientTab('facilities')} className={`tab-btn ${patientTab === 'facilities' ? 'active' : ''}`}>
                    📍 Nearby 60km Hospitals
                  </button>
                </div>

                {/* Tab 1: Health History */}
                {patientTab === 'timeline' && (
                  <div className="med-card" style={{ padding: '1.5rem' }}>
                    <h3 style={{ fontSize: '1.2rem', fontWeight: 800, color: 'var(--primary-navy-dark)', marginBottom: '1rem' }}>
                      Your Past Checkups & Lab Reports
                    </h3>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                      <div style={{ background: '#f8fafc', padding: '1rem', borderRadius: 'var(--radius-md)', border: '1px solid var(--border-light)' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.35rem' }}>
                          <strong style={{ color: 'var(--primary-navy)' }}>General Health Checkup & Blood Sugar</strong>
                          <span style={{ fontSize: '0.75rem', color: 'var(--text-subtle)' }}>24 August 2026</span>
                        </div>
                        <p style={{ fontSize: '0.85rem', color: 'var(--text-muted)', margin: '0 0 0.5rem 0' }}>
                          Checked at Vokkaleri Ayushman Arogya Mandir. Blood pressure: 138/88 mmHg. Random blood sugar: 168 mg/dL.
                        </p>
                        <div style={{ fontSize: '0.78125rem', color: 'var(--medical-teal-dark)', fontWeight: 700 }}>
                          Doctor Advice: Continue morning Metformin and walk 30 minutes daily.
                        </div>
                      </div>

                      <div style={{ background: '#f8fafc', padding: '1rem', borderRadius: 'var(--radius-md)', border: '1px solid var(--border-light)' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.35rem' }}>
                          <strong style={{ color: 'var(--primary-navy)' }}>HbA1c 3-Month Diabetes Blood Test</strong>
                          <span style={{ fontSize: '0.75rem', color: 'var(--text-subtle)' }}>12 July 2026</span>
                        </div>
                        <p style={{ fontSize: '0.85rem', color: 'var(--text-muted)', margin: '0 0 0.5rem 0' }}>
                          Tested at SNR District Hospital. HbA1c result: 7.6% (Slightly high). Urine microalbumin: 38 mg/L.
                        </p>
                      </div>
                    </div>
                  </div>
                )}

                {/* Tab 2: Prescriptions Schedule */}
                {patientTab === 'prescriptions' && (
                  <div className="med-card" style={{ padding: '1.5rem' }}>
                    <h3 style={{ fontSize: '1.2rem', fontWeight: 800, color: 'var(--primary-navy-dark)', marginBottom: '1rem' }}>
                      Your Daily Medicine Timetable
                    </h3>
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: '1rem' }}>
                      <div style={{ background: '#fffbeb', border: '1px solid #fde68a', borderRadius: 'var(--radius-md)', padding: '1rem' }}>
                        <div style={{ fontSize: '0.75rem', fontWeight: 800, color: '#d97706', marginBottom: '0.25rem' }}>☀️ MORNING (After Breakfast)</div>
                        <h4 style={{ fontSize: '1.05rem', color: 'var(--primary-navy-dark)', margin: '0 0 0.25rem 0' }}>Metformin 500mg (1 Tablet)</h4>
                        <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>For controlling blood sugar</div>
                        <div style={{ marginTop: '0.5rem', fontSize: '0.8rem', fontWeight: 700, color: 'var(--primary-navy)' }}>Telmisartan 40mg (1 Tablet) — for BP</div>
                      </div>

                      <div style={{ background: '#f0fdf4', border: '1px solid #bbf7d0', borderRadius: 'var(--radius-md)', padding: '1rem' }}>
                        <div style={{ fontSize: '0.75rem', fontWeight: 800, color: '#16a34a', marginBottom: '0.25rem' }}>🌙 NIGHT (After Dinner)</div>
                        <h4 style={{ fontSize: '1.05rem', color: 'var(--primary-navy-dark)', margin: '0 0 0.25rem 0' }}>Metformin 500mg (1 Tablet)</h4>
                        <div style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>For controlling blood sugar</div>
                      </div>
                    </div>
                  </div>
                )}

                {/* Tab 3: Ask Health Questions */}
                {patientTab === 'assistant' && (
                  <div className="med-card" style={{ padding: '1.5rem' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '0.5rem', marginBottom: '1rem' }}>
                      <h3 style={{ fontSize: '1.2rem', fontWeight: 800, color: 'var(--primary-navy-dark)', margin: 0 }}>
                        Ask Questions About Your Health
                      </h3>
                      <div style={{ display: 'flex', gap: '0.35rem' }}>
                        <button onClick={() => setAiLang('en')} className={`btn btn-sm ${aiLang === 'en' ? 'btn-primary' : 'btn-secondary'}`}>English</button>
                        <button onClick={() => setAiLang('hi')} className={`btn btn-sm ${aiLang === 'hi' ? 'btn-primary' : 'btn-secondary'}`}>हिंदी</button>
                        <button onClick={() => setAiLang('kn')} className={`btn btn-sm ${aiLang === 'kn' ? 'btn-primary' : 'btn-secondary'}`}>ಕನ್ನಡ</button>
                      </div>
                    </div>

                    <div style={{ display: 'flex', gap: '0.5rem', marginBottom: '1rem' }}>
                      <input 
                        type="text" 
                        className="form-input" 
                        placeholder={aiLang === 'hi' ? 'जैसे: क्या मैं बुखार में पैरासिटामोल ले सकता हूँ?' : aiLang === 'kn' ? 'ಉದಾಹರಣೆಗೆ: ನನಗೆ ಜ್ವರ ಬಂದರೆ ಯಾವ ಮಾತ್ರೆ ತೆಗೆದುಕೊಳ್ಳಬೇಕು?' : 'e.g. Can I take Paracetamol for fever? Or how is my sugar?'} 
                        value={aiQuery} 
                        onChange={(e) => setAiQuery(e.target.value)} 
                        onKeyDown={(e) => { if (e.key === 'Enter') handleAskAI(); }}
                      />
                      <button onClick={handleAskAI} className="btn btn-teal">
                        Ask
                      </button>
                    </div>

                    {aiAnswer && (
                      <div style={{ background: 'var(--medical-teal-subtle)', border: '1px solid #99f6e4', borderRadius: 'var(--radius-md)', padding: '1rem', marginTop: '1rem' }}>
                        <div style={{ fontSize: '0.75rem', fontWeight: 800, color: 'var(--medical-teal-dark)', marginBottom: '0.25rem' }}>ANSWER BASED ON YOUR RECORDS:</div>
                        <p style={{ fontSize: '0.9375rem', color: 'var(--text-main)', lineHeight: '1.6', margin: 0 }}>
                          {aiAnswer}
                        </p>
                      </div>
                    )}
                  </div>
                )}

                {/* Tab 4: 60km Hospitals */}
                {patientTab === 'facilities' && (
                  <div className="med-card" style={{ padding: '1.5rem' }}>
                    <h3 style={{ fontSize: '1.2rem', fontWeight: 800, color: 'var(--primary-navy-dark)', marginBottom: '1rem' }}>
                      Hospitals Near You (60km Radius)
                    </h3>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '0.75rem' }}>
                      {hospitals.slice(0, 5).map(h => (
                        <div key={h.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: '#f8fafc', padding: '0.85rem 1rem', borderRadius: 'var(--radius-md)', border: '1px solid var(--border-light)' }}>
                          <div>
                            <strong style={{ color: 'var(--primary-navy)' }}>{h.name}</strong>
                            <div style={{ fontSize: '0.78125rem', color: 'var(--text-muted)' }}>{h.category} • {h.address}</div>
                          </div>
                          <a href={`tel:${h.contact}`} className="btn btn-teal btn-sm" style={{ textDecoration: 'none' }}>
                            📞 {h.distanceKm} km away
                          </a>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

              </div>
            )}

            {/* VIEW 3: DOCTOR DASHBOARD */}
            {currentRole === 'doctor' && currentUser && (
              <div className="app-container" style={{ padding: '2rem 1.5rem' }}>
                <div className="med-card" style={{ background: 'linear-gradient(135deg, #ffffff 0%, #f0f9ff 100%)', border: '1px solid var(--border-medium)', marginBottom: '1.75rem' }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '1rem' }}>
                    <div>
                      <h2 style={{ fontSize: '1.4rem', fontWeight: 800, color: 'var(--primary-navy-dark)', margin: 0 }}>
                        {currentUser.name} ({currentUser.qualifications})
                      </h2>
                      <div style={{ fontSize: '0.85rem', color: 'var(--text-muted)', marginTop: '0.2rem' }}>
                        Duty Station: <strong>{currentUser.currentPlaceOfPractice}</strong> • UID: {currentUser.uid}
                      </div>
                    </div>
                    <div style={{ background: 'var(--medical-teal-subtle)', padding: '0.4rem 0.85rem', borderRadius: 'var(--radius-full)', border: '1px solid #99f6e4', fontSize: '0.8125rem', fontWeight: 700, color: 'var(--medical-teal-dark)' }}>
                      Active Patient: Ramesh Gowda (48y M)
                    </div>
                  </div>
                </div>

                <div className="med-card" style={{ padding: '1.5rem' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', marginBottom: '0.5rem' }}>
                    <span className="badge badge-teal">2-Second Patient Summary</span>
                  </div>
                  <h3 style={{ fontSize: '1.25rem', fontWeight: 800, color: 'var(--primary-navy-dark)', marginBottom: '0.5rem' }}>
                    Health Overview — Ramesh Gowda
                  </h3>
                  <div style={{ background: '#fef2f2', border: '1px solid #fecaca', borderRadius: 'var(--radius-md)', padding: '0.75rem 1rem', marginBottom: '1rem', color: '#dc2626', fontWeight: 700, fontSize: '0.875rem' }}>
                    🚨 Severe Penicillin Allergy Alert: Strictly avoid Amoxicillin, Ampicillin & Augmentin.
                  </div>
                  <div style={{ background: '#f8fafc', padding: '1rem', borderRadius: 'var(--radius-md)', border: '1px solid var(--border-light)', marginBottom: '1rem', fontSize: '0.875rem', lineHeight: '1.6' }}>
                    <strong>Clinical Summary:</strong> 48yo male with Type-2 Diabetes and Hypertension. Latest HbA1c is 7.6%. BP is controlled at 138/88 mmHg. Taking Metformin 500mg BID and Telmisartan 40mg OD. Regular visits with village ASHA worker Kavitha M.
                  </div>
                  <div style={{ display: 'flex', gap: '0.75rem' }}>
                    <button onClick={() => alert('New digital prescription created and synced to patient!')} className="btn btn-primary btn-sm">
                      ✍️ Write New Prescription
                    </button>
                    <button onClick={() => alert('Referral sent to SNR District Hospital with instant summary handover!')} className="btn btn-outline-teal btn-sm">
                      🏥 Send Referral to 60km Specialist Hospital
                    </button>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* QR MODAL */}
          {qrModalOpen && (
            <div className="modal-backdrop" onClick={() => setQrModalOpen(false)}>
              <div className="modal-content" onClick={(e) => e.stopPropagation()} style={{ maxWidth: '420px', textAlign: 'center' }}>
                <h3 style={{ fontSize: '1.3rem', fontWeight: 800, color: 'var(--primary-navy-dark)', marginBottom: '0.35rem' }}>
                  Digital Health Card QR
                </h3>
                <p style={{ fontSize: '0.8125rem', color: 'var(--text-muted)', marginBottom: '1.25rem' }}>
                  Show this QR code at any clinic or hospital to open your health records instantly.
                </p>
                <div style={{ width: '200px', height: '200px', margin: '0 auto 1.25rem auto', padding: '10px', background: '#fff', border: '2px dashed var(--medical-teal)', borderRadius: '12px', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=ABHA-91-4428-9912-7741-RameshGowda" alt="QR Code" style={{ width: '100%', height: '100%' }} />
                </div>
                <div style={{ fontSize: '0.9rem', fontWeight: 700, color: 'var(--primary-navy)' }}>
                  Ramesh Gowda • 91-4428-9912-7741
                </div>
                <button onClick={() => setQrModalOpen(false)} className="btn btn-secondary btn-sm" style={{ marginTop: '1.25rem', width: '100%' }}>
                  Close
                </button>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer style={{ backgroundColor: 'var(--primary-navy-dark)', color: '#ffffff', padding: '3.5rem 0 2rem 0', borderTop: '1px solid rgba(255, 255, 255, 0.1)' }}>
            <div className="app-container">
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: '2rem', marginBottom: '2rem' }}>
                <div>
                  <h4 style={{ color: '#fff', fontSize: '1.1rem', marginBottom: '0.75rem' }}>🩺 MediSetu Health</h4>
                  <p style={{ fontSize: '0.85rem', color: '#94a3b8', lineHeight: '1.6' }}>Simple, unbroken healthcare for villages and towns. Keeping records safe and connecting hospitals within 60km.</p>
                </div>
                <div>
                  <h4 style={{ color: '#fff', fontSize: '0.95rem', marginBottom: '0.75rem' }}>Covered Regions (60km)</h4>
                  <div style={{ fontSize: '0.8125rem', color: '#cbd5e1', display: 'flex', flexDirection: 'column', gap: '0.35rem' }}>
                    <span>• Kolar District & Taluks</span>
                    <span>• Bangarapet & Malur</span>
                    <span>• Hoskote & East Bangalore Rural</span>
                    <span>• Mulbagal & Chintamani</span>
                  </div>
                </div>
                <div>
                  <h4 style={{ color: '#fff', fontSize: '0.95rem', marginBottom: '0.75rem' }}>Emergency Helpline</h4>
                  <div style={{ fontSize: '0.85rem', color: '#cbd5e1' }}>
                    <div>Ambulance: <strong style={{ color: '#f87171' }}>108</strong></div>
                    <div>Health Helpline: <strong style={{ color: '#14b8a6' }}>104</strong></div>
                  </div>
                </div>
              </div>
              <div style={{ borderTop: '1px solid rgba(255,255,255,0.1)', paddingTop: '1.25rem', fontSize: '0.75rem', color: '#94a3b8', textAlign: 'center' }}>
                © {new Date().getFullYear()} MediSetu. Built for everyday families, doctors, and village health workers.
              </div>
            </div>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
